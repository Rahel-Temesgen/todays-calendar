<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <title>Today's Calendar</title>
  </head>
  <body class="h-screen bg-[#6a5acd] flex justify-center items-center m-0 p-0">
    <main
      class="w-[60%] max-w-[500px] flex flex-col items-center justify-center"
    >
      <div
        class="bg-[#ff4122] p-4 rounded-t-2xl w-full flex justify-center items-center"
      >
        <h2 id="month" class="text-white text-[8vw] md:text-5xl font-bold">
          January
        </h2>
      </div>
      <div
        class="bg-white p-4 rounded-b-2xl flex flex-col justify-center items-center w-full"
      >
        <p id="day" class="text-gray-400 text-[6vw] md:text-3xl font-medium">
          Tuesday
        </p>
        <h1 id="date" class="m-10 text-[18vw] md:text-9xl font-bold">13</h1>
        <p id="year" class="text-gray-400 text-[6vw] md:text-3xl font-medium">
          2026
        </p>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
